<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOTASK | Projects</title>
    <link href="./css/output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  </head>

  <body class="text-dark-slate font-poppins bg-lotask-background-grey antialiased">
    <section id="Dashboard" class="flex flex-col lg:flex-row min-h-screen">
      <!-- START Sidebar -->
      <div
        id="Sidebar"
        class="w-full lg:w-70 flex flex-col gap-5 lg:gap-7.5 p-5 lg:p-7.5 shrink-0 lg:h-screen lg:overflow-y-auto no-scrollbar bg-lotask-white border-b-4 lg:border-b-0 lg:border-r-4 border-darken-slate"
      >
        <div class="flex justify-center py-2 lg:py-4 bg-lotask-white">
          <img src="img/logo-lotask.webp" alt="logo" class="w-40 lg:w-50" />
        </div>

        <div class="general-menu flex flex-col gap-3 lg:gap-4.5">
          <h3 class="font-extrabold text-xs lg:text-sm leading-5.25 uppercase tracking-wider text-dark-slate/60">
            GENERAL
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3">
            <a
              href="./tasks.html"
              class="flex items-center gap-2.5 p-[12px_16px] h-12 border-2 border-darken-slate bg-lotask-white hover:bg-lotask-yellow/30 shadow-c-sm smooth-transition-150"
            >
              <div class="w-6 h-6 shrink-0">
                <i class="fa-solid fa-list-check"></i>
              </div>
              <p class="font-extrabold text-dark-slate">Manage Task</p>
            </a>
            <a
              href="./projects.html"
              class="flex items-center gap-2.5 p-[12px_16px] h-12 border-2 border-darken-slate bg-lotask-white hover:bg-lotask-yellow/30 shadow-c-sm smooth-transition-150"
            >
              <div class="w-6 h-6 shrink-0">
                <i class="fa-solid fa-diagram-project"></i>
              </div>
              <p class="font-extrabold text-dark-slate">Manage Project</p>
            </a>
          </div>
        </div>

        <hr class="border border-darken-slate hidden lg:block" />

        <div class="general-menu flex flex-col gap-3 lg:gap-4.5">
          <h3 class="font-extrabold text-xs lg:text-sm leading-5.25 uppercase tracking-wider text-dark-slate/60">
            OTHERS
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3">
            <a
              href="./update-profile.html#updateProfile"
              class="flex items-center gap-2.5 p-[12px_16px] h-12 border-2 border-darken-slate bg-lotask-orange shadow-c-md"
            >
              <div class="w-6 h-6 shrink-0">
                <i class="fa-solid fa-user"></i>
              </div>
              <p class="font-bold text-dark-slate">User Profile</p>
            </a>
            <a
              href="#"
              id="btnLogout"
              class="flex items-center gap-2.5 p-[12px_16px] h-12 border-2 border-darken-slate bg-lotask-white hover:bg-lotask-yellow/30 shadow-c-sm smooth-transition-150"
            >
              <div class="w-6 h-6 shrink-0">
                <i class="fa-solid fa-right-from-bracket"></i>
              </div>
              <p class="font-bold text-dark-slate">Logout</p>
            </a>
          </div>
        </div>
      </div>
      <!-- END Sidebar -->

      <div class="flex items-center gap-3 my-8 mx-4 lg:hidden">
        <div class="w-4 h-4 bg-black"></div>
        <div class="flex-1 border-t-4 border-black"></div>
        <div class="w-4 h-4 bg-black"></div>
      </div>

      <div
        id="Content"
        class="flex flex-col bg-lotask-background-grey w-full lg:h-screen lg:overflow-y-auto p-5 lg:p-10 gap-5 lg:gap-7.5 lg:border-l-2 border-darken-slate"
      >
        <!-- START Profile Bar -->
        <div
          class="bg-lotask-white flex justify-end items-center w-full p-4 border-2 border-darken-slate shadow-c-lg gap-4 mb-10 lg:mb-0"
        >
          <div class="flex gap-7.5 items-center">
            <div class="flex gap-3 items-center">
              <div class="*:text-right flex flex-col">
                <p class="text-dark-slate/60 text-sm w-full font-medium">Hi,</p>
                <p id="profileName" class="font-extrabold text-base lg:text-lg text-lotask-darken-slate"></p>
              </div>
              <div class="w-12 h-12 lg:w-14 lg:h-14 border-2 border-darken-slate overflow-hidden shadow-c-sm shrink-0">
                <img src="img/user-profile.webp" class="object-cover h-full w-full" alt="photo profile" />
              </div>
            </div>
          </div>
        </div>
        <!-- END Profile Bar -->

        <div class="flex flex-col gap-5 lg:gap-7.5" id="updateProfile">
          <div class="content-header flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 class="font-extrabold text-3xl lg:text-4xl leading-tight text-lotask-darken-slate text-shadow-lg">
                Update Your Profile
              </h1>
              <p class="leading-5.25 text-sm lg:text-base mt-1 font-medium text-dark-slate/70">
                Set the goals to grow your company
              </p>
            </div>
          </div>

          <form id="profileForm" class="group/form flex flex-col gap-7.5 md:flex-row">
            <!-- START Profile Form -->
            <div
              class="flex flex-col bg-lotask-white p-5 md:p-6 w-full border-2 border-darker-slate shadow-c-lg gap-5 md:gap-6"
            >
              <div class="group/username">
                <label for="username" class="font-semibold">Username</label>
                <div
                  class="group peer flex items-center p-[12px_12px] h-12 border-2 border-darker-slate focus-within:border-lotask-blue focus-within:shadow-c-md focus-within:shadow-lotask-blue mt-1.5"
                >
                  <div class="mr-2.5 w-6 h-6 flex items-center justify-center">
                    <i class="fa-solid fa-user fa-lg group-focus-within:text-lotask-blue"></i>
                  </div>
                  <input
                    id="username"
                    type="text"
                    class="font-semibold placeholder:text-slate-500 placeholder:font-normal focus:outline-none w-full"
                    placeholder="Update your username"
                    name="username"
                    required
                  />
                </div>
              </div>

              <div class="group/password">
                <label for="password" class="font-semibold">Password</label>
                <div
                  class="group peer flex items-center p-[12px_12px] h-12 border-2 border-darker-slate focus-within:border-lotask-blue focus-within:shadow-c-md focus-within:shadow-lotask-blue mt-1.5"
                >
                  <div class="mr-2.5 w-6 h-6 flex items-center justify-center">
                    <i class="fa-solid fa-lock fa-lg group-focus-within:text-lotask-blue"></i>
                  </div>
                  <input
                    id="password"
                    type="text"
                    class="font-semibold placeholder:text-slate-500 placeholder:font-normal focus:outline-none w-full"
                    placeholder="Update your password"
                    name="password"
                  />
                </div>
              </div>

              <div class="group/confirmPassword">
                <label for="confirmPassword" class="font-semibold">Confirm Password</label>
                <div
                  class="group peer flex items-center p-[12px_12px] h-12 border-2 border-darker-slate focus-within:border-lotask-blue focus-within:shadow-c-md focus-within:shadow-lotask-blue mt-1.5"
                >
                  <div class="mr-2.5 w-6 h-6 flex items-center justify-center">
                    <i class="fa-solid fa-house-lock fa-lg group-focus-within:text-lotask-blue"></i>
                  </div>
                  <input
                    id="confirmPassword"
                    type="text"
                    class="font-semibold placeholder:text-slate-500 placeholder:font-normal focus:outline-none w-full"
                    placeholder="Re-enter new password"
                    name="confirmPassword"
                  />
                </div>
              </div>

              <button
                class="self-center h-12 w-1/2 text-slate-100 border-darker-slate border-2 shadow-none p-2.5 bg-darker-slate hover:bg-blue-600 hover:shadow-c-md hover:shadow-darker-slate active:bg-blue-500 smooth-transition-300"
              >
                Save
              </button>
            </div>
            <!-- END Task Form -->
          </form>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script type="module" src="js/controllers/global.js"></script>
    <script type="module" src="js/controllers/updateProfile.js"></script>
  </body>
</html>
