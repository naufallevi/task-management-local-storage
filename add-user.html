<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  </head>

  <body class="bg-lotask-background-grey text-dark-slate font-poppins">
    <div class="container min-h-screen mx-auto flex justify-center items-center">
      <div
        id="LoginForm"
        class="flex flex-col bg-white gap-7.5 p-10 max-w-125 w-full border-2 border-darker-slate shadow-c-xl shadow-darker-slate rounded-lg"
      >
        <div class="flex justify-center">
          <a href="signin.html">
            <img src="img/logo-lotask.webp" alt="logo" class="w-65 object-cover" />
          </a>
        </div>

        <div class="flex flex-col gap-3">
          <div>
            <h1 class="font-bold text-xl leading-8.25 mb-0.75">Add New User</h1>
            <p class="text-slate-500 text-sm leading-5.25">Manage daily task easily</p>
          </div>
          <hr class="text-dark-slate" />

          <form class="flex flex-col gap-5" id="userForm">
            <div>
              <label for="username" class="font-semibold">Username</label>
              <div
                class="group flex items-center p-[10px_14px] border-2 border-darker-slate mt-1.5 focus-within:shadow-c-md focus-within:border-blue-600 focus-within:shadow-blue-600 smooth-transition-150"
              >
                <div class="mr-2.5 w-6 h-6 flex items-center justify-center">
                  <i class="fa-solid fa-user border-darker-slate group-focus-within:text-blue-600"></i>
                </div>
                <input
                  type="text"
                  class="font-semibold placeholder:text-slate-500 placeholder:font-normal focus:outline-none w-full smooth-transition-150"
                  placeholder="Type your username"
                  id="username"
                  name="username"
                  required
                />
              </div>
            </div>

            <div>
              <label for="password" class="font-semibold">Password</label>
              <div
                class="group flex items-center p-[12px_16px] border-2 border-darker-slate mt-1.5 focus-within:shadow-c-md focus-within:border-blue-600 focus-within:shadow-blue-600 smooth-transition-150"
              >
                <div class="mr-2.5 w-6 h-6 flex items-center justify-center">
                  <i
                    class="fa-solid fa-lock border-darker-slate group-focus-within:text-blue-600 smooth-transition-150"
                  ></i>
                </div>
                <input
                  type="password"
                  class="font-semibold placeholder:text-slate-500 placeholder:font-normal focus:outline-none w-full smooth-transition-150"
                  placeholder="Type your password"
                  id="password"
                  name="password"
                  required
                />
              </div>
            </div>

            <div class="text-sm leading-5.25">
              If you already have an account,
              <a href="signin.html" class="text-base font-bold text-blue-500 hover:text-blue-800 smooth-transition-150"
                >Sign In here</a
              >.
            </div>

            <button
              type="submit"
              class="self-center h-12 w-1/2 text-slate-100 border-darker-slate border-2 shadow-none p-2.5 bg-darker-slate hover:bg-blue-600 hover:shadow-c-md hover:shadow-darker-slate active:bg-blue-500 smooth-transition-300"
            >
              Sign Up
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script type="module" src="js/controllers/addUser.js"></script>
  </body>
</html>
